# The part of every job that is the same in every job.
#
# This library resolves its dependencies through pkg-config and nothing else -
# there is deliberately no sibling-checkout fallback, because a second
# resolution path that only in-tree builds exercise is one that silently rots
# (CONVENTIONS.md section 1). So cutil, unicode, chron, regex, text and runtime-core are
# built and installed into one prefix inside the workspace first, in the order
# suite/libraries.txt gives, exactly the way ../bootstrap.sh does it locally,
# and every job then builds against that prefix the way a consumer would.
#
name: Set up the build
description: Install the toolchain and build runtime-debug's dependencies into the workspace prefix.

inputs:
  packages:
    description: Apt packages this job needs beyond the common set.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential pkg-config libgtest-dev python3 \
          ${{ inputs.packages }}

    # Unpinned on purpose: the suite is developed as a whole and a library is
    # expected to build against its dependencies' tips. Pin `--branch` here if
    # that ever stops being true. Cloned beside the library under test, never
    # inside it, and in the order of suite/libraries.txt so that each finds the
    # ones before it through the PKG_CONFIG_PATH the workflow sets.
    - name: Build and install the dependencies
      shell: bash
      run: |
        for dep in cutil unicode chron regex text runtime-core; do
          git clone --depth 1 "https://github.com/Ghoti-io/$dep.git" "deps/$dep"
          make -C "deps/$dep" -j"$(nproc)" PREFIX="$PREFIX"
          make -C "deps/$dep" install PREFIX="$PREFIX"
        done
